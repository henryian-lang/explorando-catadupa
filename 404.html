<title>Explorando a Catadupa</title>
<script>
  // Corrige links copiados com pontuação ou espaços no fim (ex.: "vr.html." ou "controle.html,")
  (function () {
    var base = '/explorando-catadupa/';
    var path = decodeURIComponent(location.pathname).replace(/[\s.,;:!?)\]"'»”]+$/, '');
    var page = path.slice(path.lastIndexOf('/') + 1).toLowerCase();
    var known = { 'vr.html': 'vr.html', 'vr': 'vr.html', 'controle.html': 'controle.html', 'controle': 'controle.html', 'index.html': '', '': '' };
    var target = base + (page in known ? known[page] : '');
    location.replace(target + location.search + location.hash);
  })();
</script>
